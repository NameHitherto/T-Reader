name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            target: 'x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js for epub.js
        uses: actions/setup-node@v7
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: 'libs/epub.js/package-lock.json'

      - name: Install epub.js dependencies
        working-directory: libs/epub.js
        run: npm ci --omit=dev --ignore-scripts

      - name: Setup Node.js for T-Reader
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Read Release Notes from CHANGELOG
        id: read_release_notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v v="[${VERSION}]" '
              $0 ~ /^## / {
                if (found) exit
                found = (index($0, v) > 0)
                next
              }
              found { print }
            ' CHANGELOG.md)
          fi

          if [ -z "$NOTES" ]; then
            echo "notes=Update ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "notes<<$EOF" >> $GITHUB_OUTPUT
            printf '%s\n' "$NOTES" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'T-Reader ${{ github.ref_name }}'
          releaseBody: ${{ steps.read_release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # MSI only accepts numeric prerelease identifiers, so alpha/rc releases use NSIS.
          args: ${{ contains(github.ref_name, '-') && '--bundles nsis' || matrix.args }}
