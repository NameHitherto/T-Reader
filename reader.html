<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader</title>
    <link rel="stylesheet" href="/src/css/Titlebar.css"/>
  </head>

  <body>
    <div data-tauri-drag-region class="titlebar">
      <div class="titlebar-front-group">
        <div class="titlebar-front-button" id="titlebar-customer">
          <img 
            src="/src/assets/mdi-color.svg"
            alt="customer"
          />
        </div>
        <div class="titlebar-front-button" id="titlebar-toc">
          <img 
            src="/src/assets/toc-icon.svg"
            alt="toc"
          />
        </div>
        <div class="titlebar-front-button" id="titlebar-about">
          <img 
            src="/src/assets/about-circle-outline.svg"
            alt="about"
          />
        </div>
      </div>
      <div class="titlebar-button" id="titlebar-minimize">
        <img
          src="/src/assets/window-minimize-outline.svg"
          alt="minimize"
        />
      </div>
      <div class="titlebar-button" id="titlebar-maximize">
        <img
          src="/src/assets/window-maximize.svg"
          alt="maximize"
        />
      </div>
      <div class="titlebar-button" id="titlebar-close">
        <img src="/src/assets/window-close.svg" alt="close" />
      </div>
    </div>
    <div id="reader-app"></div>
    <script type="module" src="/src/js/init.ts"></script>
    <script type="module" src="/src/readerMain.ts"></script>
  </body>
</html>
<style>
  body{
    margin: 0;
    overflow: hidden;
  }
  #reader-app{
    position: relative;
    width: 100%;
  }
</style>
