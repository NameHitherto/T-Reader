<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader</title>
  </head>

  <body>
    <div data-tauri-drag-region class="titlebar">
      <div class="titlebar-front-group">
        <div class="titlebar-front-button" id="titlebar-customer">
          <span
            class="titlebar-icon"
            style="--titlebar-icon: url('/src/assets/mdi-color.svg')"
            aria-label="customer"
          ></span>
        </div>
        <div class="titlebar-front-button" id="titlebar-toc">
          <span
            class="titlebar-icon"
            style="--titlebar-icon: url('/src/assets/toc-icon.svg')"
            aria-label="toc"
          ></span>
        </div>
        <div class="titlebar-front-button" id="titlebar-about">
          <span
            class="titlebar-icon"
            style="--titlebar-icon: url('/src/assets/book-info.svg')"
            aria-label="about"
          ></span>
        </div>
        <div class="titlebar-front-button" id="titlebar-help">
          <span
            class="titlebar-icon"
            style="--titlebar-icon: url('/src/assets/help.svg')"
            aria-label="help"
          ></span>
        </div>
      </div>
      <div class="titlebar-button" id="titlebar-minimize">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-minimize-outline.svg')"
          aria-label="minimize"
        ></span>
      </div>
      <div class="titlebar-button" id="titlebar-maximize">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-maximize.svg')"
          aria-label="maximize"
        ></span>
      </div>
      <div class="titlebar-button" id="titlebar-close">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-close.svg')"
          aria-label="close"
        ></span>
      </div>
    </div>
    <div id="reader-app"></div>
    <script type="module" src="/src/readerMain.ts"></script>
  </body>
</html>
