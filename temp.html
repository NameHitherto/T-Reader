<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面端简约苹果风 SVG 图标</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --apple-bg: #F5F5F7;
            --apple-surface: #FFFFFF;
            --apple-border: #E5E5EA;
            /* 默认状态颜色：深空灰 */
            --icon-default: #515154; 
            /* 激活状态颜色：天空蓝 */
            --icon-active: #007AFF;  
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: #1D1D1F;
        }

        /* 桌面端卡片质感 */
        .desktop-card {
            background: var(--apple-surface);
            border: 1px solid var(--apple-border);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 统一的基础 SVG 样式：保证圆润、饱满 */
        svg.apple-icon {
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.2s ease-in-out;
        }

        /* 默认状态样式 */
        .state-default {
            color: var(--icon-default);
            stroke: var(--icon-default);
        }

        /* 激活（天空蓝）状态样式 */
        .state-active {
            color: var(--icon-active);
            stroke: var(--icon-active);
            /* 桌面端点击/激活时，图标往往会有一点微妙的下沉或光晕，这里使用轻微的发光增强辨识度 */
            filter: drop-shadow(0 2px 4px rgba(0, 122, 255, 0.2));
        }
        
        /* 交互反馈：悬浮时图标微动 */
        .icon-container:hover svg {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-8">

    <div class="max-w-3xl w-full">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-semibold mb-3 tracking-tight">桌面端应用图标集</h1>
            <p class="text-gray-500 text-sm">适配高分辨率屏幕 · 默认状态 vs 天空蓝激活状态</p>
        </header>

        <div class="desktop-card overflow-hidden">
            <!-- 表头 -->
            <div class="grid grid-cols-3 gap-4 p-4 border-b border-gray-100 bg-gray-50/50 text-xs font-medium text-gray-400 uppercase tracking-wider text-center">
                <div class="text-left pl-6">图标名称</div>
                <div>默认状态 (Default)</div>
                <div>激活状态 (Active)</div>
            </div>

            <!-- 图标列表 -->
            <div class="divide-y divide-gray-100">

                <!-- 1. 书架 -->
                <div class="grid grid-cols-3 gap-4 p-5 items-center hover:bg-gray-50 transition-colors icon-container">
                    <div class="pl-4 font-medium text-gray-700">1. 书架 (Bookshelf)</div>
                    <!-- 默认状态 -->
                    <div class="flex justify-center">
                        <svg class="apple-icon state-default" viewBox="0 0 24 24" width="28" height="28">
                            <path d="M4 20h16" />
                            <rect x="5" y="6" width="4" height="14" rx="1.5" />
                            <rect x="11" y="9" width="4" height="11" rx="1.5" />
                            <rect x="17" y="4" width="4" height="16" rx="1.5" />
                        </svg>
                    </div>
                    <!-- 激活状态 -->
                    <div class="flex justify-center">
                        <svg class="apple-icon state-active" viewBox="0 0 24 24" width="28" height="28">
                            <path d="M4 20h16" />
                            <rect x="5" y="6" width="4" height="14" rx="1.5" />
                            <rect x="11" y="9" width="4" height="11" rx="1.5" />
                            <rect x="17" y="4" width="4" height="16" rx="1.5" />
                        </svg>
                    </div>
                </div>

                <!-- 2. 笔记 -->
                <div class="grid grid-cols-3 gap-4 p-5 items-center hover:bg-gray-50 transition-colors icon-container">
                    <div class="pl-4 font-medium text-gray-700">2. 笔记 (Note)</div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-default" viewBox="0 0 24 24" width="28" height="28">
                            <path d="M14 3v4a2 2 0 0 0 2 2h4" />
                            <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l6 6v10a2 2 0 0 1-2 2z" />
                            <line x1="9" y1="13" x2="15" y2="13" />
                            <line x1="9" y1="17" x2="13" y2="17" />
                        </svg>
                    </div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-active" viewBox="0 0 24 24" width="28" height="28">
                            <path d="M14 3v4a2 2 0 0 0 2 2h4" />
                            <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l6 6v10a2 2 0 0 1-2 2z" />
                            <line x1="9" y1="13" x2="15" y2="13" />
                            <line x1="9" y1="17" x2="13" y2="17" />
                        </svg>
                    </div>
                </div>

                <!-- 3. 关于 -->
                <div class="grid grid-cols-3 gap-4 p-5 items-center hover:bg-gray-50 transition-colors icon-container">
                    <div class="pl-4 font-medium text-gray-700">3. 关于 (About)</div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-default" viewBox="0 0 24 24" width="28" height="28">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="16" x2="12" y2="12" />
                            <circle cx="12" cy="8" r="1.25" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-active" viewBox="0 0 24 24" width="28" height="28">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="16" x2="12" y2="12" />
                            <circle cx="12" cy="8" r="1.25" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                </div>

                <!-- 4. 更多 -->
                <div class="grid grid-cols-3 gap-4 p-5 items-center hover:bg-gray-50 transition-colors icon-container">
                    <div class="pl-4 font-medium text-gray-700">4. 更多 (More)</div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-default" viewBox="0 0 24 24" width="28" height="28">
                            <circle cx="5" cy="12" r="1.75" fill="currentColor" stroke="none" />
                            <circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none" />
                            <circle cx="19" cy="12" r="1.75" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-active" viewBox="0 0 24 24" width="28" height="28">
                            <circle cx="5" cy="12" r="1.75" fill="currentColor" stroke="none" />
                            <circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none" />
                            <circle cx="19" cy="12" r="1.75" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                </div>

                <!-- 5. 列表 -->
                <div class="grid grid-cols-3 gap-4 p-5 items-center hover:bg-gray-50 transition-colors icon-container">
                    <div class="pl-4 font-medium text-gray-700">5. 列表 (List)</div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-default" viewBox="0 0 24 24" width="28" height="28">
                            <line x1="9" y1="6" x2="20" y2="6" />
                            <line x1="9" y1="12" x2="20" y2="12" />
                            <line x1="9" y1="18" x2="20" y2="18" />
                            <circle cx="4.5" cy="6" r="1.5" fill="currentColor" stroke="none" />
                            <circle cx="4.5" cy="12" r="1.5" fill="currentColor" stroke="none" />
                            <circle cx="4.5" cy="18" r="1.5" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-active" viewBox="0 0 24 24" width="28" height="28">
                            <line x1="9" y1="6" x2="20" y2="6" />
                            <line x1="9" y1="12" x2="20" y2="12" />
                            <line x1="9" y1="18" x2="20" y2="18" />
                            <circle cx="4.5" cy="6" r="1.5" fill="currentColor" stroke="none" />
                            <circle cx="4.5" cy="12" r="1.5" fill="currentColor" stroke="none" />
                            <circle cx="4.5" cy="18" r="1.5" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                </div>

                <!-- 6. 网格 -->
                <div class="grid grid-cols-3 gap-4 p-5 items-center hover:bg-gray-50 transition-colors icon-container">
                    <div class="pl-4 font-medium text-gray-700">6. 网格 (Grid)</div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-default" viewBox="0 0 24 24" width="28" height="28">
                            <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" />
                            <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" />
                            <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" />
                            <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" />
                        </svg>
                    </div>
                    <div class="flex justify-center">
                        <svg class="apple-icon state-active" viewBox="0 0 24 24" width="28" height="28">
                            <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" />
                            <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" />
                            <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" />
                            <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" />
                        </svg>
                    </div>
                </div>

            </div>
        </div>
        
    </div>

</body>
</html>
