[package]
name = "T-Reader"
version = "2.1.1"
description = "An ePub Reader based on Tauri"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "t_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-shell = "=2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "json"] }
tauri-plugin-fs = "=2.5.1"
dirs = "4.0"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-http = "=2.5.9"
reqwest = {version = "0.11", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
base64 = "0.22"
http = "0.2"
tauri-plugin-os = "=2.3.2"
quick-xml = "=0.36.2"
futures-util = "0.3"
epub-builder = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
chardetng = "0.1"
encoding_rs = "0.8"
fancy-regex = "0.14"
fontdb = "0.23"
ttf-parser = { version = "0.25", features = ["std"] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-log = "=2.9.0"
log = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
urlencoding = "2.1"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

tauri-plugin-window-state = "=2.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
