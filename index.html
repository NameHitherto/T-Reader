<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookShelf</title>
  </head>

  <body>
    <div class="titlebar" id="titlebar-custom">
      <div data-tauri-drag-region class="titlebar-drag-region"></div>
      <div id="titlebar-page-title" class="titlebar-page-title"></div>
      <div id="titlebar-page-actions" class="titlebar-page-actions"></div>
      <div class="titlebar-button" id="titlebar-minimize" aria-label="最小化窗口">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-minimize-outline.svg')"
          aria-label="minimize"
        ></span>
      </div>
      <div class="titlebar-button" id="titlebar-maximize" aria-label="最大化窗口">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-maximize.svg')"
          aria-label="maximize"
        ></span>
      </div>
      <div class="titlebar-button titlebar-button--close" id="titlebar-close" aria-label="关闭窗口">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-close.svg')"
          aria-label="close"
        ></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
