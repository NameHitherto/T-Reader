<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + Vue + Typescript App</title>
  </head>

  <body>
    <div data-tauri-drag-region class="titlebar" id="titlebar-custom">
      <div class="titlebar-button" id="titlebar-minimize">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-minimize-outline.svg')"
          aria-label="minimize"
        ></span>
      </div>
      <div class="titlebar-button" id="titlebar-maximize">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-maximize.svg')"
          aria-label="maximize"
        ></span>
      </div>
      <div class="titlebar-button" id="titlebar-close">
        <span
          class="titlebar-icon"
          style="--titlebar-icon: url('/src/assets/window-close.svg')"
          aria-label="close"
        ></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/js/init.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
