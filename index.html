<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + Vue + Typescript App</title>
    <link rel="stylesheet" href="/src/css/Titlebar.css" />
  </head>

  <body>
    <div data-tauri-drag-region class="titlebar" id="titlebar-custom">
      <div class="titlebar-button" id="titlebar-minimize">
        <img src="/src/assets/window-minimize-outline.svg" alt="minimize" />
      </div>
      <div class="titlebar-button" id="titlebar-maximize">
        <img src="/src/assets/window-maximize.svg" alt="maximize" />
      </div>
      <div class="titlebar-button" id="titlebar-close">
        <img src="/src/assets/window-close.svg" alt="close" />
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
<style>
  @font-face {
    font-family: 'System-main';
    src: url('/src/font/pingfang.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  body {
    margin: 0;
    font-family: 'System-main', sans-serif;
  }
</style>
